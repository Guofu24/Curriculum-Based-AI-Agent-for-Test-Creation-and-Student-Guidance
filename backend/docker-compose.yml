services:
  # ── MinIO — S3-compatible object storage ────────────────────────────────────
  # NOTE: Nếu bạn đã chạy MinIO ngoài Docker (minio.exe server E:\MiNIO)
  #       thì comment/bỏ qua service này và trỏ .env về http://127.0.0.1:9000
  minio:
    image: minio/minio:latest
    container_name: examai-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API — S3-compatible endpoint
      - "9001:9001"   # Web Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - examai_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: examai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: examai
      POSTGRES_PASSWORD: examai
      POSTGRES_DB: examai
    volumes:
      - examai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examai"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: examai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - examai_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: examai-celery
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      - CELERYD_CONCURRENCY=4
      - CELERYD_MAX_TASKS_PER_CHILD=1000

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: examai-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  examai_miniodata:
  examai_pgdata:
  examai_redisdata:
